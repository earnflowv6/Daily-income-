<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
    padding-bottom:75px;
}

.header{
    height:75px;
    background:linear-gradient(135deg,#3858d8,#4c6de8);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.left{
    display:flex;
    align-items:center;
    gap:18px;
}

.menu{
    font-size:32px;
}

.reels{
    font-family:Georgia,serif;
    font-size:23px;
    font-weight:bold;
    font-style:italic;
}

.title{
    font-size:30px;
    font-weight:bold;
}

.icons{
    font-size:25px;
    display:flex;
    gap:15px;
}

/* TABS */

.tabs{
    background:white;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    padding:15px 8px;
    gap:5px;
    box-shadow:0 2px 8px #ddd;
}

.tab{
    text-align:center;
    padding:15px 5px;
    font-size:16px;
    color:#555;
    border-radius:16px;
}

.tab.active{
    background:#4161db;
    color:white;
    font-weight:bold;
}

/* PRODUCT */

.product{
    background:white;
    margin:15px 0;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 8px #ddd;
}

.product-head{
    background:#4161db;
    color:white;
    width:58%;
    padding:14px 22px;
    font-size:21px;
    font-weight:bold;
    border-radius:0 0 55px 0;
}

.product-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
}

.details{
    width:55%;
}

.details p{
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.price{
    color:#12a84d;
    font-size:24px !important;
}

.image{
    width:40%;
    text-align:center;
}

.image img{
    width:125px;
    height:125px;
    object-fit:contain;
}

.buy{
    display:block;
    background:#1460e8;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:14px 10px;
    border-radius:35px;
    font-size:18px;
    font-weight:bold;
    margin-top:12px;
}

/* CHANNEL */

.channel{
    margin:18px 12px;
    background:#20c95b;
    padding:16px;
    border-radius:35px;
    text-align:center;
}

.channel a{
    color:white;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
}

/* BOTTOM */

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:70px;
    background:white;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    box-shadow:0 -2px 10px #ccc;
    z-index:100;
}

.bottom a{
    text-decoration:none;
    color:#555;
    text-align:center;
    padding-top:8px;
    font-size:12px;
}

.bottom span{
    display:block;
    font-size:27px;
    margin-bottom:3px;
}

.bottom .active{
    color:#3155c9;
}

/* MOBILE */

@media(max-width:400px){

    .title{
        font-size:26px;
    }

    .icons{
        font-size:20px;
        gap:8px;
    }

    .product-head{
        font-size:19px;
    }

    .details p{
        font-size:16px;
    }

    .price{
        font-size:22px !important;
    }

    .image img{
        width:105px;
        height:105px;
    }

}

</style>
</head>

<!-- HEADER -->

<div class="header">

    <div class="left">

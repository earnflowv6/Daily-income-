<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Deals</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172b4d;
}

a{
  text-decoration:none;
  color:inherit;
}

.app{
  max-width:720px;
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
}

/* HEADER */
.top{
  background:linear-gradient(135deg,#183d83,#4168df);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.sub{
  font-size:12px;
  opacity:.85;
  margin-top:4px;
}

.menu{
  font-size:28px;
}

/* BANNER */
.banner{
  margin:14px;
  border-radius:18px;
  background:linear-gradient(135deg,#112b61,#315fd2);
  color:white;
  padding:25px 20px;
  box-shadow:0 8px 22px rgba(25,61,131,.18);
}

.pill{
  display:inline-block;
  background:#ffffff22;
  border:1px solid #ffffff55;
  border-radius:30px;
  padding:7px 12px;
  font-size:12px;
  margin-bottom:10px;
}

.banner h1{
  font-size:27px;
  line-height:1.15;
  margin-bottom:8px;
}

.banner p{
  font-size:14px;
  line-height:1.5;
}

/* QUICK MENU */
.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  background:white;
  margin:0 14px 16px;
  padding:14px 8px;
  border-radius:18px;
  box-shadow:0 4px 15px #0000000b;
}

.quick a{
  text-align:center;
  font-size:12px;
  color:#27457d;
}

.ico{
  font-size:27px;
  display:block;
  margin-bottom:6px;
}

/* TABS */
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:white;
  margin:0 14px 16px;
  border-radius:30px;
  padding:4px;
  box-shadow:0 4px 15px #0000000b;
}

.tab{
  padding:13px;
  text-align:center;
  border-radius:26px;
  font-weight:700;
  color:#777;
}

.tab.active{
  background:#21438b;
  color:white;
}

/* PRODUCT CARDS */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:0 14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:12px;
  box-shadow:0 5px 18px #0000000b;
}

.pic{
  height:145px;
  border-radius:13px;
  background:linear-gradient(135deg,#eaf0ff,#fff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.card h3{
  font-size:15px;
  color:#c62828;
  margin:12px 2px 10px;
}

.info{
  font-size:13px;
  line-height:1.9;
  color:#222;
}

.info b{
  float:right;
  color:#173d78;
}
